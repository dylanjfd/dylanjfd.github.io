# Veille souveraineté numérique : collecte quotidienne des actualités, e-mail le lundi vers 7 h 45 (Paris).
#
# Les flux RSS ne gardent que leurs derniers articles (parfois moins de 7 jours) : chaque jour,
# collect.py --accumuler met les articles trouvés de côté (veille/tampon.json, gardé dans le cache
# de GitHub Actions, jamais dans le dépôt). Le lundi, collect.py envoie l'e-mail puis le workflow
# enregistre veille/seen.json et le digest de la semaine dans le dépôt.
#
# Le cron de GitHub est en UTC : 7 h 45 à Paris = 5 h 45 UTC en heure d'été, 6 h 45 UTC en hiver.
# Les deux heures sont programmées ; seule celle qui tombe à 7 h 45 à Paris envoie l'e-mail.
#
# Identifiants : secrets GitHub GMAIL_USER, GMAIL_APP_PASSWORD et VEILLE_TO (voir le README).

name: Veille souveraineté

on:
  schedule:
    - cron: '30 18 * * *'  # chaque jour, 18 h 30 UTC : collecte seule
    - cron: '45 5 * * 1'   # lundi 5 h 45 UTC = 7 h 45 à Paris (heure d'été)
    - cron: '45 6 * * 1'   # lundi 6 h 45 UTC = 7 h 45 à Paris (heure d'hiver)
  workflow_dispatch:
    inputs:
      mode:
        description: "envoyer = envoi réel ; essai = affiche l'e-mail dans le journal sans l'envoyer"
        type: choice
        options: [envoyer, essai]
        default: essai

permissions:
  contents: write

concurrency:
  group: veille
  cancel-in-progress: false

jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Choisir l'action (collecte, envoi ou essai)
        id: mode
        env:
          EVENEMENT: ${{ github.event_name }}
          PLANIFICATION: ${{ github.event.schedule }}
          MODE_MANUEL: ${{ inputs.mode }}
        run: |
          decalage=$(TZ=Europe/Paris date +%z)   # +0200 en été, +0100 en hiver
          mode=accumuler
          if [ "$EVENEMENT" = workflow_dispatch ]; then
            mode="$MODE_MANUEL"
          elif [ "$PLANIFICATION" = '45 5 * * 1' ] && [ "$decalage" = '+0200' ]; then
            mode=envoyer
          elif [ "$PLANIFICATION" = '45 6 * * 1' ] && [ "$decalage" = '+0100' ]; then
            mode=envoyer
          fi
          echo "Mode : $mode (heure de Paris : UTC$decalage)"
          echo "mode=$mode" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Installer feedparser
        run: python -m pip install --disable-pip-version-check -r veille/requirements.txt

      - name: Reprendre les articles mis de côté
        uses: actions/cache/restore@v6
        with:
          path: veille/tampon.json
          key: veille-tampon-${{ github.run_id }}
          restore-keys: veille-tampon-

      - name: Collecter les actualités
        if: steps.mode.outputs.mode == 'accumuler'
        run: python veille/collect.py --accumuler

      - name: Afficher l'e-mail sans l'envoyer
        if: steps.mode.outputs.mode == 'essai'
        run: python veille/collect.py --dry-run

      - name: Envoyer l'e-mail de la semaine
        if: steps.mode.outputs.mode == 'envoyer'
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          VEILLE_TO: ${{ secrets.VEILLE_TO }}
        run: python veille/collect.py

      - name: Garder les articles mis de côté pour la prochaine fois
        if: always() && steps.mode.outputs.mode != 'essai' && hashFiles('veille/tampon.json') != ''
        uses: actions/cache/save@v6
        with:
          path: veille/tampon.json
          key: veille-tampon-${{ github.run_id }}

      - name: Enregistrer seen.json et le digest dans le dépôt
        if: steps.mode.outputs.mode == 'envoyer'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add veille/seen.json veille/digests
          if git diff --cached --quiet; then
            echo "Rien à enregistrer (pas d'actualité cette semaine)."
            exit 0
          fi
          git commit -m "Veille : digest du $(TZ=Europe/Paris date +%d/%m/%Y)"
          git pull --rebase
          git push
