# Ancienne méthode, remplacée par Apps Script (veille/apps-script/Code.gs).
#
# La collecte quotidienne et l'e-mail du lundi passent maintenant par Google Apps Script. Ce workflow
# n'a plus de déclenchement planifié, pour éviter tout double envoi : il ne se lance qu'à la main
# (onglet Actions → Veille (ancienne méthode) → Run workflow). Le mode « essai » affiche l'e-mail
# de collect.py dans le journal sans l'envoyer ; « envoyer » l'envoie puis enregistre
# veille/seen.json et le digest de la semaine dans le dépôt.
#
# Identifiants : secrets GitHub GMAIL_USER, GMAIL_APP_PASSWORD et VEILLE_TO (voir le README).

name: Veille (ancienne méthode)

on:
  workflow_dispatch:
    inputs:
      mode:
        description: "envoyer = envoi réel ; essai = affiche l'e-mail dans le journal sans l'envoyer"
        type: choice
        options: [envoyer, essai]
        default: essai

permissions:
  contents: write

concurrency:
  group: veille
  cancel-in-progress: false

jobs:
  veille:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Choisir l'action (envoi ou essai)
        id: mode
        env:
          MODE_MANUEL: ${{ inputs.mode }}
        run: |
          echo "Mode : $MODE_MANUEL"
          echo "mode=$MODE_MANUEL" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'

      - name: Installer feedparser
        run: python -m pip install --disable-pip-version-check -r veille/requirements.txt

      - name: Reprendre les articles mis de côté
        uses: actions/cache/restore@v6
        with:
          path: veille/tampon.json
          key: veille-tampon-${{ github.run_id }}
          restore-keys: veille-tampon-

      - name: Afficher l'e-mail sans l'envoyer
        if: steps.mode.outputs.mode == 'essai'
        run: python veille/collect.py --dry-run

      - name: Envoyer l'e-mail de la semaine
        if: steps.mode.outputs.mode == 'envoyer'
        env:
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          VEILLE_TO: ${{ secrets.VEILLE_TO }}
        run: python veille/collect.py

      - name: Garder les articles mis de côté pour la prochaine fois
        if: always() && steps.mode.outputs.mode != 'essai' && hashFiles('veille/tampon.json') != ''
        uses: actions/cache/save@v6
        with:
          path: veille/tampon.json
          key: veille-tampon-${{ github.run_id }}

      - name: Enregistrer seen.json et le digest dans le dépôt
        if: steps.mode.outputs.mode == 'envoyer'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add veille/seen.json veille/digests
          if git diff --cached --quiet; then
            echo "Rien à enregistrer (pas d'actualité cette semaine)."
            exit 0
          fi
          git commit -m "Veille : digest du $(TZ=Europe/Paris date +%d/%m/%Y)"
          git pull --rebase
          git push
